<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eighty8 vision</title>
<meta http-equiv="refresh" content="1; url=https://eighty8vision.com">
<link rel="canonical" href="https://eighty8vision.com">
<style>
  :root{
    --ink:#2B2926;
    --body:#4A463F;
    --muted:#8A8478;
    --line:#D9D3C7;
    --accent:#6B5D4F;
    --pagebg:#FAF8F4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--pagebg);
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    color:var(--body);
    text-align:center;
    padding:24px;
  }
  .card{
    max-width:420px;
  }
  .wordmark{
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--accent);
    text-decoration:none;
    display:inline-block;
    margin-bottom:8px;
  }
  .wordmark::after{
    content:'';
    display:block;
    width:32px;
    height:1px;
    background:var(--accent);
    margin:6px auto 0;
  }
  h1{
    font-family:'Montserrat', 'Helvetica Neue', sans-serif;
    font-weight:400;
    font-size:22px;
    color:var(--ink);
    margin:28px 0 12px;
    line-height:1.35;
  }
  p{
    font-size:15px;
    line-height:1.6;
    color:var(--muted);
    margin:32px 0 28px;
  }
  a.go{
    display:inline-block;
    padding:12px 28px;
    border:1px solid var(--accent);
    color:var(--accent);
    text-decoration:none;
    font-size:13px;
    letter-spacing:0.5px;
  }
  a.go:hover{
    background:var(--accent);
    color:var(--pagebg);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="wordmark">Eighty8 Vision</span>
    <p>You're being redirected to eighty8vision.com. If nothing happens, use the link below.</p>
    <a class="go" href="https://eighty8vision.com">Go to eighty8vision.com &rarr;</a>
  </div>
</body>
</html>
